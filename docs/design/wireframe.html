<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Business Ledger — wireframe</title>
    <style>
      :root {
        --bg: #eceae6;
        --ink: #222;
        --muted: #5a5a5a;
        --line: #2a2a2a;
        --fill: #f7f6f3;
        --dash: #9a9a9a;
        --dash-soft: #c8c8c8;
        --call: #1f4d7a;
        --phone: #111;
        --space-4: 4px;
        --space-8: 8px;
        --space-12: 12px;
        --space-16: 16px;
        --space-24: 24px;
        --space-32: 32px;
        --space-40: 40px;
        --space-48: 48px;
        --space-64: 64px;
        --space-80: 80px;
        --space-96: 96px;
        --s8: var(--space-8);
        --s16: var(--space-16);
        --s24: var(--space-24);
        --side: var(--space-24);
        --tap: var(--space-48);
        --tap-min: var(--space-48);
        --gap: var(--space-8);
        --section-gap: var(--space-24);
        --radius: var(--space-8);
        --nav-h: var(--space-48);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      .page {
        max-width: 1440px;
        margin: 0 auto;
        padding: var(--section-gap) var(--side) var(--space-64);
      }
      @media (max-width: 599px) {
        .page { padding: var(--space-16) var(--space-16) var(--space-64); }
      }
      h1 { margin: 0 0 var(--space-8); font-size: 1.6rem; font-weight: 800; }
      .lede { margin: 0 0 var(--space-16); color: var(--muted); max-width: 70ch; font-size: 14px; }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gap);
        margin-bottom: var(--section-gap);
      }
      .toolbar button {
        min-height: var(--tap);
        min-width: var(--tap-min);
        padding: 0 var(--space-16);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      .toolbar button.is-on {
        background: var(--ink);
        color: #fff;
      }
      .toolbar a {
        min-height: var(--tap);
        display: inline-flex;
        align-items: center;
        padding: 0 var(--space-16);
        border: 1px dashed var(--dash);
        border-radius: var(--radius);
        color: var(--ink);
        text-decoration: none;
      }
      .board {
        display: none;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: var(--space-32);
      }
      .board.is-on { display: grid; }
      .focus {
        display: none;
        gap: var(--space-32);
        align-items: start;
      }
      .focus.is-on { display: grid; }
      @media (min-width: 1100px) {
        .focus.is-on { grid-template-columns: minmax(720px, 1fr) 320px; }
      }
      .desk {
        width: 1080px;
        max-width: 100%;
        margin: 0 auto;
        background: #fff;
        border: 2px solid var(--phone);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 12px 0 rgba(0,0,0,0.06);
      }
      .chrome {
        height: 28px;
        background: #e4e4e4;
        color: var(--muted);
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
      }
      .chrome i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: #fff;
        display: block;
      }
      .chrome .url {
        flex: 1;
        min-width: 0;
        height: 16px;
        border: 1px solid var(--dash);
        border-radius: 8px;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 8px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .shell {
        display: grid;
        grid-template-columns: 200px 1fr;
        min-height: 520px;
        background: var(--fill);
      }
      .side {
        background: #e8e6e1;
        border-right: 1px solid var(--line);
        padding: var(--space-16);
        font-size: 12px;
        display: flex;
        flex-direction: column;
      }
      .brand-row {
        display: flex;
        align-items: center;
        gap: var(--space-8);
        margin-bottom: var(--space-16);
      }
      .mark {
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        background: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        flex-shrink: 0;
      }
      .brand-row strong { display: block; font-size: 13px; }
      .brand-row small { color: var(--muted); font-size: 11px; }
      .biz-switch {
        border: 1px solid var(--dash);
        background: #fff;
        border-radius: var(--radius);
        padding: var(--space-8) var(--space-16);
        margin-bottom: var(--space-16);
        min-height: var(--tap);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--space-4);
      }
      .biz-switch span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; }
      .nav-label {
        display: block;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: var(--space-16) 0 var(--space-8);
        font-size: 10px;
        font-weight: 800;
      }
      .side .nav-item {
        display: flex;
        align-items: center;
        min-height: var(--tap);
        padding: 0 var(--space-16);
        border: 1px solid transparent;
        border-radius: var(--radius);
        margin-bottom: var(--space-8);
      }
      .side .nav-item.on {
        background: #fff;
        border-color: var(--line);
        font-weight: 700;
      }
      .vat-note {
        margin-top: var(--space-16);
        padding-top: var(--space-16);
        border-top: 1px dashed var(--dash-soft);
        color: var(--muted);
        font-size: 11px;
      }
      .main-col { min-width: 0; display: flex; flex-direction: column; }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: var(--space-16);
        padding: var(--space-16) var(--space-24);
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      .topbar strong {
        display: block;
        font-size: 22px;
        font-weight: 800;
        line-height: 1.15;
        margin-top: var(--space-4);
      }
      .topbar .micro {
        display: block;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .top-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-8);
        justify-content: flex-end;
        align-items: flex-end;
      }
      .period-wrap {
        display: grid;
        gap: var(--space-4);
      }
      .ghost {
        border: 1px solid var(--dash);
        border-radius: var(--radius);
        min-height: var(--tap);
        padding: 0 var(--space-16);
        display: inline-flex;
        align-items: center;
        font-size: 12px;
        background: #fff;
        white-space: nowrap;
      }
      .body {
        flex: 1;
        padding: var(--space-24) var(--space-32);
        font-size: 12px;
      }
      @media (max-width: 599px) {
        .body { padding: var(--space-16); }
      }
      .box {
        border: 1px solid var(--line);
        padding: var(--space-24);
        margin-bottom: var(--space-24);
        background: #fff;
        position: relative;
        border-radius: var(--radius);
        container-type: inline-size;
        container-name: card;
      }
      .box:last-child { margin-bottom: 0; }
      .box h3, .panel-head h3 {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: var(--space-8);
        margin-bottom: var(--space-16);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--s8);
        min-height: var(--tap);
        padding: var(--space-8) 0;
        border-top: 1px dashed var(--dash-soft);
        font-variant-numeric: tabular-nums;
      }
      .row:first-of-type { border-top: 0; }
      .n {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--call);
        color: #fff;
        font-size: 12px;
        display: grid;
        place-items: center;
        z-index: 1;
      }
      .callouts { background: #fff; border: 1px solid var(--line); padding: var(--space-16); border-radius: var(--radius); }
      .callouts h2 { margin: 0 0 var(--gap); font-size: 1.15rem; font-weight: 800; }
      .callouts ol { margin: 0; padding-left: var(--section-gap); }
      .callouts li { margin: 0 0 var(--gap); }
      .screen-label {
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 var(--space-8);
        color: var(--muted);
        font-weight: 700;
      }
      .muted { color: var(--muted); font-weight: 400; }
      .helper {
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
        margin: 0 0 var(--space-16);
        line-height: 1.45;
      }

      /* Persistent labels + 48px controls */
      .fl {
        display: grid;
        gap: var(--space-4);
        min-width: 0;
        align-content: start;
      }
      .fl-name {
        font-size: 11px;
        font-weight: 800;
        color: var(--ink);
        letter-spacing: 0.02em;
        line-height: 1.2;
      }
      .control {
        border: 1px solid var(--line);
        min-height: var(--tap);
        padding: 0 var(--space-16);
        color: var(--ink);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        font-size: 12px;
        background: #fff;
        width: 100%;
      }
      .control .ex { color: var(--muted); }
      .control.area {
        min-height: var(--space-80);
        align-items: flex-start;
        padding: var(--space-12) var(--space-16);
      }

      /* Clusters: internal 8–12, separation 24, shared left keyline */
      .cluster {
        display: grid;
        gap: var(--space-8);
        margin: 0 0 var(--space-24);
      }
      .cluster:last-of-type { margin-bottom: 0; }
      .form-stack > .cluster:last-of-type { margin-bottom: var(--space-24); }
      .cluster-row {
        display: grid;
        gap: var(--space-8) var(--space-12);
        align-items: start;
      }
      .cluster-row.cols-1 { grid-template-columns: 1fr; }
      .cluster-row.cols-2,
      .cluster-row.cols-3 {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .btn {
        border: 1px solid var(--line);
        min-height: var(--tap);
        padding: 0 var(--space-16);
        text-align: center;
        font-weight: 700;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        background: #fff;
      }
      .btn.fill { background: var(--ink); color: #fff; border-color: var(--ink); }
      .cta {
        width: 100%;
        margin: 0;
      }
      .btns { display: flex; gap: var(--space-8); flex-wrap: wrap; }
      .btns .btn, .btns .ghost { flex: 1; min-width: 96px; }

      .grid2, .grid3, .grid4, .grid6 {
        display: grid;
        gap: var(--space-16);
        margin-bottom: var(--space-24);
      }
      .grid2 { grid-template-columns: 1fr 1fr; }
      .grid3 { grid-template-columns: 1fr 1fr 1fr; }
      .grid4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
      .grid6 { grid-template-columns: repeat(6, 1fr); }
      .tile {
        border: 1px solid transparent;
        background: var(--fill);
        border-radius: var(--radius);
        padding: var(--space-24);
        min-height: var(--space-80);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: var(--space-8);
      }
      .tile span {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .tile strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 800; }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
        gap: var(--space-24);
        align-items: start;
        margin-bottom: var(--space-24);
      }
      .split:last-child { margin-bottom: 0; }
      .split > .box { margin-bottom: 0; }
      .hero-h {
        margin: 0 0 var(--space-8);
        font-size: 20px;
        font-weight: 800;
        line-height: 1.2;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 var(--space-8);
        font-weight: 800;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: var(--space-24);
        border: 1px solid var(--dash-soft);
        border-radius: 999px;
        padding: 0 var(--space-8);
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
        white-space: nowrap;
      }
      .mini {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .mini th, .mini td {
        text-align: left;
        padding: var(--space-12) var(--space-16);
        border-bottom: 1px solid var(--dash-soft);
        vertical-align: middle;
        height: var(--space-40);
      }
      .mini th {
        color: var(--ink);
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.04em;
        background: #efeeea;
        white-space: nowrap;
      }
      .mini .num { text-align: right; white-space: nowrap; }
      .mini tbody tr { height: var(--space-48); }
      .table-scroll { overflow-x: auto; }

      .todo-cols {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-16);
        align-items: stretch;
      }
      .todo-cols .box {
        margin-bottom: 0;
        min-height: 100%;
        padding: var(--space-16) var(--space-24);
        display: flex;
        flex-direction: column;
      }
      .kanban {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-16);
        align-items: stretch;
      }
      .col {
        border: 1px dashed var(--dash-soft);
        border-radius: var(--radius);
        padding: var(--space-16);
        min-height: var(--space-96);
        background: var(--fill);
        display: flex;
        flex-direction: column;
        gap: var(--space-8);
      }
      .col b {
        display: block;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 0 0 var(--space-8);
      }
      .card {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: var(--radius);
        padding: var(--space-16);
        font-size: 12px;
        margin: 0;
      }
      .card .row { min-height: var(--space-32); padding: var(--space-4) 0; }
      .chk {
        width: var(--space-16);
        height: var(--space-16);
        border: 1px solid var(--line);
        display: inline-block;
        vertical-align: middle;
        margin-right: var(--space-8);
        flex-shrink: 0;
      }
      .mock {
        border: 1px dashed var(--dash-soft);
        border-radius: var(--radius);
        min-height: var(--space-80);
        padding: var(--space-24);
        background: var(--fill);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: var(--space-16);
      }
      .empty-state {
        border: 1px dashed var(--dash-soft);
        background: var(--fill);
        padding: var(--space-24);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-8);
      }
      .empty-state strong { font-size: 13px; }
      .empty-state .meta { color: var(--muted); font-size: 11px; }
      .empty-state .value {
        font-size: 16px;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
      }
      .col .empty-state {
        border: 0;
        background: transparent;
        padding: var(--space-8) 0 0;
        flex: 1;
      }
      .alert {
        border: 1px dashed var(--dash-soft);
        border-radius: var(--radius);
        padding: var(--space-16) var(--space-24);
        margin-bottom: var(--space-24);
        background: #fff;
        display: flex;
        justify-content: space-between;
        gap: var(--space-16);
        align-items: center;
        position: relative;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-24);
      }
      .settings-grid .box { margin-bottom: 0; }

      .board .shell { grid-template-columns: 132px 1fr; min-height: 0; }
      .board .body { padding: var(--space-16); font-size: 11px; }
      .board .split,
      .board .grid3,
      .board .grid4,
      .board .grid6,
      .board .todo-cols,
      .board .kanban,
      .board .settings-grid { grid-template-columns: 1fr 1fr; }
      .board .cluster { margin-bottom: var(--space-16); }
      #screen-tabs button { font-size: 13px; padding: 0 var(--space-16); }

      @page { size: A4 landscape; margin: 10mm; }
      @media print {
        .toolbar { display: none !important; }
        .focus { display: none !important; }
        .board { display: grid !important; gap: 8px; grid-template-columns: repeat(2, 1fr); }
        body { background: #fff; }
        .page { max-width: none; padding: 0; }
        .desk { box-shadow: none; width: 100%; }
        .shell { min-height: 0; }
        .lede { display: none; }
        h1 { font-size: 1rem; }
        .body { padding: 8px; font-size: 9px; }
        .side .nav-item, .ghost, .control, .btn { min-height: 24px; }
        .cluster { margin-bottom: 8px; }
        .box { padding: 8px; margin-bottom: 8px; }
        .tile, .empty-state, .card { padding: 8px; }
      }

      @media (max-width: 1023px) {
        .split { grid-template-columns: 1fr; }
        .grid4 { grid-template-columns: 1fr 1fr; }
        .grid6 { grid-template-columns: 1fr 1fr 1fr; }
        .todo-cols { grid-template-columns: 1fr; }
        .kanban { grid-template-columns: 1fr 1fr; }
        .settings-grid { grid-template-columns: 1fr; }
        .page { padding-left: var(--space-24); padding-right: var(--space-24); }
      }
      @media (max-width: 720px) {
        .shell, .board .shell { grid-template-columns: 1fr; }
        .side { border-right: 0; border-bottom: 1px solid var(--line); }
        .topbar { flex-direction: column; align-items: stretch; }
        .top-actions { justify-content: stretch; }
        .ghost, .period-wrap, .period-wrap .ghost { width: 100%; }
      }
      @media (max-width: 599px) {
        .grid2, .grid3, .grid4, .grid6,
        .kanban, .todo-cols, .settings-grid,
        .board .split, .board .grid3, .board .grid4,
        .board .grid6, .board .todo-cols, .board .kanban,
        .board .settings-grid { grid-template-columns: 1fr; }
        .page { padding-left: var(--space-16); padding-right: var(--space-16); }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Business Ledger — wireframe</h1>
      <p class="lede">
        Layout only. Boxes and labels show what sits on each desktop view.
        This is not the live app and not live books. Grey on purpose so we can agree structure.
        Private finance tool — amounts are placeholders (R 0). Left side-nav, not a phone PWA.
      </p>
      <div class="toolbar">
        <button type="button" id="btn-focus" class="is-on">One screen</button>
        <button type="button" id="btn-board">All 11 screens</button>
        <a href="../../index.html">Open live app</a>
      </div>

      <div class="focus is-on" id="focus">
        <div>
          <div class="toolbar" id="screen-tabs"></div>
          <div id="frame-host"></div>
        </div>
        <aside class="callouts" id="callouts"></aside>
      </div>

      <div class="board" id="board"></div>
    </div>

    <script>
      const NAV_BOOKS = [
        ["dashboard", "Dashboard"],
        ["transactions", "Money In / Out"],
        ["invoices", "Invoices"],
        ["todos", "Checklists"],
        ["reports", "Reports"],
        ["settings", "Settings"]
      ];
      const NAV_TOOLS = [
        ["quotes", "Quotes"],
        ["projects", "Web Projects"],
        ["orders", "Orders"],
        ["suppliers", "Suppliers"],
        ["assets", "NSR Listings"]
      ];
      const ORDER = [
        "dashboard", "transactions", "invoices", "todos", "reports", "settings",
        "quotes", "projects", "orders", "suppliers", "assets"
      ];
      const TAB_LABEL = Object.fromEntries([...NAV_BOOKS, ...NAV_TOOLS]);

      function field(name, example) {
        const inner = example ? `<span class="ex">${example}</span>` : "";
        return `<label class="fl"><span class="fl-name">${name}</span><span class="control">${inner}</span></label>`;
      }
      function area(name, example) {
        const inner = example ? `<span class="ex">${example}</span>` : "";
        return `<label class="fl"><span class="fl-name">${name}</span><span class="control area">${inner}</span></label>`;
      }
      function cluster(items, cols) {
        const n = cols || items.length || 1;
        return `<div class="cluster"><div class="cluster-row cols-${n}">${items.join("")}</div></div>`;
      }
      function cta(label) {
        return `<div class="btn fill cta">${label}</div>`;
      }
      function emptyState(title, meta, value) {

      function deskHtml(key) {
        const s = SCREENS[key];
        return `
          <p class="screen-label">${s.title}</p>
          <div class="desk">
            <div class="chrome">
              <i></i><i></i><i></i>
              <span class="url">index.html#${s.hash}</span>
            </div>
            <div class="shell">
              ${sideHtml(key)}
              <div class="main-col">
                ${topHtml(s.title)}
                <div class="body">${s.html}</div>
              </div>
            </div>
          </div>`;
      }

      function notesHtml(key) {
        const s = SCREENS[key];
        return `<h2>${s.title}</h2>
          <p><em>${s.purpose}</em></p>
          <ol>${s.notes.map((n) => `<li>${n}</li>`).join("")}</ol>`;
      }

      let current = "dashboard";
      const focus = document.getElementById("focus");
      const board = document.getElementById("board");
      const host = document.getElementById("frame-host");
      const callouts = document.getElementById("callouts");
      const tabs = document.getElementById("screen-tabs");

      tabs.innerHTML = ORDER.map((k) =>
        `<button type="button" data-screen="${k}">${TAB_LABEL[k]}</button>`
      ).join("");

      function showFocus(key) {
        current = key;
        host.innerHTML = deskHtml(key);
        callouts.innerHTML = notesHtml(key);
        tabs.querySelectorAll("button").forEach((b) => {
          b.classList.toggle("is-on", b.getAttribute("data-screen") === key);
        });
      }

      function showBoard() {
        board.innerHTML = ORDER.map((k) => `<div>${deskHtml(k)}</div>`).join("");
      }

      document.getElementById("btn-focus").onclick = () => {
        document.getElementById("btn-focus").classList.add("is-on");
        document.getElementById("btn-board").classList.remove("is-on");
        focus.classList.add("is-on");
        board.classList.remove("is-on");
      };
      document.getElementById("btn-board").onclick = () => {
        document.getElementById("btn-board").classList.add("is-on");
        document.getElementById("btn-focus").classList.remove("is-on");
        focus.classList.remove("is-on");
        board.classList.add("is-on");
        showBoard();
      };
      tabs.querySelectorAll("button").forEach((b) => {
        b.onclick = () => showFocus(b.getAttribute("data-screen"));
      });
      showFocus("dashboard");
      if (/[?&]print=1/.test(location.search)) {
        document.getElementById("btn-board").click();
      }
    </script>
  </body>
</html>
